name: AI News Dependency Audit

on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: dependency-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: 0.11.32
          python-version: 3.13.14
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Restore frozen dependencies
        run: uv sync --frozen --all-groups
      - name: Audit installed dependencies
        run: uv run --frozen pip-audit --local
