name: AI News Quality Gate

on:
  pull_request: {}
  push:
    branches:
      - master
    paths-ignore:
      - data/inbox.jsonl
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: 0.11.32
          python-version: 3.13.14
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install pinned Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.17.0
          cache: npm
      - name: Install pinned npm
        run: npm install --global npm@11.16.0
      - name: Restore frozen dependencies
        run: |
          uv sync --frozen --all-groups
          npm ci
      - name: Static analysis
        run: uv run --frozen ruff check .
      - name: Install Chromium runtime
        run: npx playwright install chromium
      - name: Quality checkpoint
        run: uv run --frozen python tools/quality_gate.py checkpoint
      - name: Browser gate
        run: uv run --frozen python tools/browser_gate.py --profile core
      - name: Accessibility gate
        run: uv run --frozen python tools/accessibility_gate.py check
      - name: Upload quality evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/
          if-no-files-found: error
          retention-days: 14

  performance:
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [one, two, three]
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: 0.11.32
          python-version: 3.13.14
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install pinned Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.17.0
          cache: npm
      - name: Install pinned npm
        run: npm install --global npm@11.16.0
      - name: Restore frozen dependencies
        run: |
          uv sync --frozen --all-groups
          npm ci
      - name: Install Chromium runtime
        run: npx playwright install chromium
      - name: Performance gate
        run: |
          uv run --frozen python tools/performance_gate.py check
          $exitCode = $LASTEXITCODE
          "performance_exit_code=$exitCode" >> $env:GITHUB_OUTPUT
          exit 0
      - name: Upload performance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-gate-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.runner }}
          path: output/performance-gate/
          if-no-files-found: warn
          retention-days: 14

  performance-arbitration:
    needs: [quality, performance]
    if: ${{ always() }}
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: 0.11.32
          python-version: 3.13.14
      - name: Restore frozen Python dependencies
        run: uv sync --frozen --all-groups
      - name: Download performance evidence
        id: download
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: performance-gate-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: performance-evidence
      - name: Arbitrate independent performance runners
        if: ${{ always() }}
        run: uv run --frozen python tools/performance_arbitration.py --input-dir performance-evidence --output output/performance-arbitration/summary.json
      - name: Upload arbitration evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-arbitration-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/performance-arbitration/
          if-no-files-found: error
          retention-days: 14

  python-314-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned uv and Python 3.14
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: 0.11.32
          python-version: 3.14.6
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Restore frozen dependencies
        run: uv sync --frozen --all-groups
      - name: Run compatibility tests
        run: uv run --frozen pytest tests -q --tb=short
