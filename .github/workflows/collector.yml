name: AI News Collector

on:
  schedule:
    # 每小时第 7 分钟触发（避开 :00/:30 高峰）
    - cron: '7 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collector
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.11.32
          python-version: 3.13.14
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Restore frozen runtime dependencies
        run: uv sync --frozen --no-dev

      - name: Run collector
        run: uv run --frozen --no-dev python collector.py

      - name: Commit and push changes
        run: |
          set -e
          git config user.name  "ai-news-bot"
          git config user.email "bot@ai-news.local"
          # inbox.jsonl 是唯一需要跨 Action 运行持久化的文件
          # processed_cache / source_health 在 .gitignore 中，不提交
          git add data/inbox.jsonl
          if git diff --staged --quiet; then
            echo "No new articles"
          else
            COUNT=$(git diff --staged data/inbox.jsonl | grep '^+[^+]' | wc -l)
            git commit -m "collector: $(date -u +%Y-%m-%dT%H:%M)Z — ~${COUNT} articles"
            git push
            echo "Pushed ${COUNT} new articles"
          fi
